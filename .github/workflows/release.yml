name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Validate tag and package version
        run: |
          node --input-type=commonjs -e '
            const packageVersion = require("./package.json").version;
            const expectedTag = `v${packageVersion}`;
            if (process.env.GITHUB_REF_NAME !== expectedTag) {
              console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${packageVersion}`);
              process.exit(1);
            }
          '

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v5.0.5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies from lockfile
        run: bun ci

      - name: Run code quality checks
        run: bun run check

      - name: Run offline tests
        run: bun run test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          release_package_spec="$(node --input-type=commonjs -p '
            const packageJson = require("./package.json");
            `${packageJson.name}@${packageJson.version}`;
          ')"
          if npm view "$release_package_spec" version >/dev/null 2>&1; then
            echo "$release_package_spec is already published."
            exit 0
          fi
          npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
