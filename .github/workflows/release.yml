name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release version
        run: |
          node --input-type=commonjs -e '
            const packageVersion = require("./package.json").version;
            const expectedTag = `v${packageVersion}`;
            if (process.env.GITHUB_REF_NAME !== expectedTag) {
              console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${packageVersion}`);
              process.exit(1);
            }
          '

      - name: Check formatting, lint, and types
        run: bun run check

      - name: Run offline tests
        run: bun run test

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          release_package_spec="$(node --input-type=commonjs -p '
            const packageJson = require("./package.json");
            `${packageJson.name}@${packageJson.version}`;
          ')"
          if npm view "$release_package_spec" version >/dev/null 2>&1; then
            echo "$release_package_spec is already published."
            exit 0
          fi
          npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
